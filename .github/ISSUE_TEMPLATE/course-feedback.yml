name: Ideas for GEAP 103
description: Tell Brett how you'd like to work for the rest of GEAP 103.
title: "Ideas: "
body:
  - type: markdown
    attributes:
      value: |
        This page is public. Don't write your full name, your student number, or anything private.
        If you'd rather not post in public, send Brett a Blackboard message with the same answers.
  - type: dropdown
    id: section
    attributes:
      label: Your section
      options:
        - Monday
        - Wednesday
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: What the course plans
      description: What did you and your agent find in the course files? What do you think of it?
  - type: dropdown
    id: route
    attributes:
      label: How do you want to work for the rest of the term?
      options:
        - Finish more tasks first, then a project
        - Start a project now and use tasks when I need them
        - A mix of tasks and a project
        - Something different (tell me below)
    validations:
      required: true
  - type: textarea
    id: ideas
    attributes:
      label: My ideas for the class
      description: How should we work? What would help you aim higher? Your ideas can follow the course plan or be different.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: A project idea I like
      description: From the project ideas page, or your own idea.
  - type: dropdown
    id: slows
    attributes:
      label: What slows you down most?
      multiple: true
      options:
        - Setup or accounts
        - The English in the guide
        - Not knowing what to make
        - Not enough time
        - Something else (tell me above)
  - type: dropdown
    id: team
    attributes:
      label: Do you want to work alone, with a partner, or in a small group?
      options:
        - Alone
        - With a partner
        - In a small group
        - Not sure yet
  - type: checkboxes
    id: checked
    attributes:
      label: Before you post
      options:
        - label: I read this before it was posted, and it says what I think.
          required: true
