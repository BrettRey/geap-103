name: Ideas for GEAP 103
description: Tell Brett how you'd like to work for the rest of GEAP 103.
title: "Ideas: "
body:
  - type: markdown
    attributes:
      value: |
        This page is public. Don't write your full name, your student number, or anything private.
        If you'd rather not post in public, send Brett a Blackboard message with the same answers.
  - type: dropdown
    id: section
    attributes:
      label: Your section
      options:
        - Monday
        - Wednesday
    validations:
      required: true
  - type: textarea
    id: imagined
    attributes:
      label: What the course imagines
      description: What did you and your agent find in the course files?
  - type: textarea
    id: forward
    attributes:
      label: How I'd like us to work for the rest of the term, and why
      description: Your ideas can follow the course plan or be completely different.
    validations:
      required: true
  - type: textarea
    id: ambitious
    attributes:
      label: The most ambitious thing I'd like to make
  - type: textarea
    id: need
    attributes:
      label: What I'd need from the class
  - type: checkboxes
    id: checked
    attributes:
      label: Before you post
      options:
        - label: I read this before it was posted, and it says what I think.
          required: true
