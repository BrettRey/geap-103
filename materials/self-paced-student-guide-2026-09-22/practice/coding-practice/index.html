<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Practice cost calculator</title><style>body{font:1.1rem/1.6 system-ui;max-width:36rem;margin:3rem auto;padding:0 1.3rem;color:#162943}label{display:block;margin:1rem 0}input,button{font:inherit;padding:.5rem}input{display:block;max-width:100%;border:1px solid #778ba3}button{background:#1250a3;color:white;border:0;border-radius:.3rem}input:focus-visible,button:focus-visible{outline:3px solid #b77800;outline-offset:3px}.warning{background:#fff4d9;padding:1rem}output{display:block;margin-top:1rem;font-weight:700}</style><script src="calculator.js" defer></script></head><body><h1>Practice cost calculator</h1><p class="warning">Classroom prototype. This version has a deliberate mistake. Don't use it for real costs.</p><form id="calculator"><label for="quantity">Number of items<input id="quantity" name="quantity" inputmode="numeric" value="3"></label><label for="price">Cost of one item ($)<input id="price" name="price" inputmode="decimal" value="2.50"></label><button type="submit">Calculate</button><output id="result" aria-live="polite"></output></form><p>Try the example, then check it with a calculator. Read the README for Task 22.</p><script>document.getElementById('calculator').addEventListener('submit',function(event){event.preventDefault();const result=document.getElementById('result');try{result.textContent='Total: $'+totalCost(document.getElementById('quantity').value,document.getElementById('price').value).toFixed(2);}catch(error){result.textContent=error.message;}});</script></body></html>
